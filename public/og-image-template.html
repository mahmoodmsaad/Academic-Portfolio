<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 60px;
    }
    h1 {
      font-size: 72px;
      margin: 0 0 20px 0;
      font-weight: bold;
    }
    h2 {
      font-size: 36px;
      margin: 0 0 30px 0;
      opacity: 0.9;
      font-weight: normal;
    }
    p {
      font-size: 28px;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.6;
      opacity: 0.95;
    }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 10px 30px;
      border-radius: 50px;
      font-size: 20px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">PhD Researcher</div>
    <h1>M Saad Mahmood</h1>
    <h2>Computational Chemistry & Materials Science</h2>
    <p>Advancing Sustainable Energy through DFT Simulations, Machine Learning & 2D Materials Research</p>
  </div>
</body>
</html>
